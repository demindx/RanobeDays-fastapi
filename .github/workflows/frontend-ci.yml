name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: bun run test:e2e

      - name: Build
        run: bun run build

      - name: Check bundle budget
        run: bun run check:bundle-budget

      - name: Lighthouse mobile thresholds
        env:
          LIGHTHOUSE_CHROME_PATH: /home/runner/.cache/ms-playwright/chromium-*/chrome-linux/chrome
        run: |
          CHROME_PATH=$(ls -1 $LIGHTHOUSE_CHROME_PATH | head -n1)
          LIGHTHOUSE_CHROME_PATH="$CHROME_PATH" bun run lighthouse:mobile
