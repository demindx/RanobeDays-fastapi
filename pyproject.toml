[project]
name = "ranobedays"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [ "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.13" ]
dependencies = [
  "asyncpg>=0.30",
  "bcrypt>=4.3",
  "fastapi[standard,standard]>=0.115.14",
  "pre-commit>=4.2",
  "pydantic[email]>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pyjwt>=2.10.1",
  "sqlalchemy>=2.0.41",
]

[tool.ruff]
target-version = "py313" # Или ваша версия Python
# Основные настройки
line-length = 88 # Совместимо с black
# Исключения
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]
# Исправления
fix = true
unsafe-fixes = true

# Настройки импортов (совместимо с isort)
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.docstring-code-line-length = "dynamic"
# Автоматическое форматирование длинных строк
format.docstring-code-format = true
# Настройки форматирования
# Правила линтинга
lint.select = [
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [
  "B904",
  "E501", # line too long, handled by formatter
]
# Настройки линтинга
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [ "src" ]
lint.pycodestyle.max-line-length = 88
