[project]
name = "ranobedays"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [ "Programming Language :: Python :: 3 :: Only" ]
dependencies = [
  "asyncpg>=0.30",
  "bcrypt>=4.3",
  "fastapi[standard,standard]>=0.115.14",
  "pgvector>=0.4.1",
  "pre-commit>=4.2",
  "pydantic[email]>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pyjwt>=2.10.1",
  "sqlalchemy>=2.0.41",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]
fix = true
unsafe-fixes = true

format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = true
lint.select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "UP",
  "W",
]
lint.ignore = [
  "B904",
  "E501",
]

lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [ "src" ]
lint.pycodestyle.max-line-length = 88
