services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile

    depends_on:
      - db

    ports:
      - 8080:8080

    restart: unless-stopped

    volumes:
      - ./:/app
      - /app/.venv

  db:
    image: ankane/pgvector

    ports:
      - ${POSTGRES_DB_HOST_PORT}:5432

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}

    volumes:
      - app_db:/var/lib/postgresql/data

  pg-admin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - 8888:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=ranobedays@admin.com
      - PGADMIN_DEFAULT_PASSWORD=qwdqwd

    volumes:
      - pgadmin-data:/var/lib/pgadmin


volumes:
  pgadmin-data:
  app_db:
